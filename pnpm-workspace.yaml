packages:
  - "packages/*"

catalog:
  "@types/node": "^24.19.2"
  hono: "^4.13.13"
  http-status-codes: "^2.3.0"
  i18next: "^26.5.8"
  socket.io: "^4.8.4"
  socket.io-client: "^4.8.4"
  typescript: "^7.0.2"
  uuid: "^14.0.3"
  zod: "^4.6.7"

allowBuilds:
  esbuild: true
  oxlint: true
  oxlint-tsgolint: true

overrides:
